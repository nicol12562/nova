<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav">
        <a href="/" class="logo">Nova</a>
        <a href="/chat">Chat</a>
        <a href="/planes">Planes</a>
        <a href="/admin">Admin</a>
        <a href="/api">API</a>
    </nav>
    <div class="feedback-container">
        <header class="feedback-header">
            <h1>Envíanos tu Feedback</h1>
            <p>Tu opinión nos ayuda a mejorar</p>
        </header>
        <form class="feedback-form" id="feedback-form">
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@ejemplo.com" required>
            </div>
            <div class="form-group">
                <label for="rating">Calificación</label>
                <div class="star-rating" id="rating">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
            </div>
            <div class="form-group">
                <label for="message"> Mensaje</label>
                <textarea id="message" name="message" rows="5" placeholder="Cuéntanos tu experiencia..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">Enviar Feedback</button>
        </form>
        <div class="feedback-stats">
            <div class="stat">
                <h3>4.7</h3>
                <p>Calificación promedio</p>
            </div>
            <div class="stat">
                <h3>248</h3>
                <p>Mensajes recibidos</p>
            </div>
            <div class="stat">
                <h3>92%</h3>
                <p>Satisfacción del cliente</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
