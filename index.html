<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 40px; }
        h1 { font-size: 3.5rem; color: white; margin-bottom: 10px; letter-spacing: 4px; }
        p { color: rgba(255,255,255,0.9); font-size: 1.1rem; margin-bottom: 40px; }
        .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .cards a { display: inline-block; padding: 14px 28px; background: white; color: #667eea; text-decoration: none; border-radius: 30px; font-weight: 700; transition: all 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .cards a:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(0,0,0,0.3); background: #667eea; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nova</h1>
        <p>Selecciona un módulo</p>
        <div class="cards">
            <a href="/chat">Chat</a>
            <a href="/planes">Planes</a>
            <a href="/admin">Admin</a>
            <a href="/api">API</a>
            <a href="/feedback">Feedback</a>
        </div>
    </div>
</body>
</html>
